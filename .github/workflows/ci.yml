name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ops_system
          POSTGRES_USER: ops_user
          POSTGRES_PASSWORD: ops_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ops_user -d ops_system"
          --health-interval 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ops_system
      DB_USER: ops_user
      DB_PASSWORD: ops_password
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --watchAll=false --passWithNoTests
        working-directory: frontend
      - run: npm run build
        working-directory: frontend